# Laatuportti jokaiselle pushille ja PR:lle: npm run tarkista (tyypit, lint, yksikkötestit).
# Sama tarkistus ajetaan paikallisesti pre-push-hookissa (.githooks/pre-push).
# Build ja sisältötarkistukset ajetaan Vercelissä ja käsin (docs/16).
name: Tarkistukset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tarkistukset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tarkista
