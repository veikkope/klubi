# Laatuportti jokaiselle pushille ja PR:lle: tyypit, lint ja lomakkeiden testit.
# Build ja sisältötarkistukset ajetaan Vercelissä ja käsin (docs/16).
name: Tarkistukset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tarkistukset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:kommentit
